# ============================================================
# train_linear_probe.yaml — Linear Probe (Frozen Backbone)
# ============================================================

experiment:
  name: "linear_probe"
  description: "Frozen MAE-ViT backbone with trainable linear classifier head"
  seed: 42

training:
  epochs: 100  # lebih banyak epoch karena hanya train head
  batch_size: 64  # bisa lebih besar karena tidak perlu backward melalui backbone
  
  # Optimizer (hanya head)
  optimizer:
    type: "adamw"
    lr: 1.0e-3
    weight_decay: 0.0
    betas: [0.9, 0.999]
  
  # Learning rate scheduler
  scheduler:
    type: "cosine"
    warmup_epochs: 5
    min_lr: 1.0e-6
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    monitor: "val_f1_macro"
    mode: "max"
  
  # Mixed precision
  mixed_precision: true
  
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

# Loss
loss:
  type: "cross_entropy"
  label_smoothing: 0.0

# Logging
logging:
  log_dir: "experiments/logs/linear_probe"
  log_every_n_steps: 10
  use_tensorboard: true
  use_wandb: false
  wandb_project: "cassava-lora-mae-vit"

# Checkpointing
checkpointing:
  save_dir: "experiments/checkpoints/linear_probe"
  save_best_only: true
  save_last: true
  monitor: "val_f1_macro"

# Evaluation
evaluation:
  eval_every_n_epochs: 1
  results_file: "reports/tables/results_linear_probe.json"
